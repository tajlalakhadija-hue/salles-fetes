<title>🎊 Taj Lala Khadija</title>
<style>
:root{
  --bg:#f5ede0;--card:#fdf6ec;--border:#e2cfa8;--border2:#d4a857;
  --text:#2c1f0e;--text2:#6b4c2a;--text3:#a08060;
  --blue:#8b3a6b;--blue-bg:#f8eef4;--purple:#5c2a4e;--purple-bg:#f3eaf1;
  --green:#059669;--green-bg:#ecfdf5;--red:#dc2626;--red-bg:#fef2f2;
  --orange:#d97706;--orange-bg:#fffbeb;--gold:#c8963c;
  --shadow:0 2px 12px rgba(92,42,78,0.08);--shadow2:0 4px 20px rgba(92,42,78,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);overflow:hidden;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#1a1a2e 0%,#2d1832 40%,#1a1a2e 100%);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{background:linear-gradient(160deg,#fdf6ec 0%,#fff 60%);border-radius:28px;padding:32px 24px 28px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,0.18);border:1.5px solid #e8c97a;}
.login-logo{margin-bottom:14px;}
.login-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px;color:#2c1f0e;letter-spacing:0.3px;}
.login-sub{text-align:center;font-size:13px;color:#8a6a3a;margin-bottom:22px;}
.login-err{background:var(--red-bg);border:1px solid #fca5a5;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:12px;display:none;text-align:center;}
.lfi{display:block;width:100%;background:#fdf6ec;border:1.5px solid #d4a857;border-radius:12px;padding:12px 14px;color:#2c1f0e;font-size:16px;outline:none;font-family:inherit;margin-bottom:12px;}
.lfi:focus{border-color:#8b3a6b;box-shadow:0 0 0 3px rgba(139,58,107,0.12);}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#5c2a4e,#8b3a6b);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(92,42,78,0.35);}

/* CHANGE PWD */
#change-pwd-screen{position:fixed;inset:0;background:linear-gradient(160deg,#1a1a2e 0%,#2d1832 40%,#1a1a2e 100%);z-index:998;display:none;align-items:center;justify-content:center;padding:24px;}
.cpwd-box{background:linear-gradient(160deg,#fdf6ec 0%,#fff 60%);border-radius:28px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,0.22);border:1.5px solid #e8c97a;}

/* APP */
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative;}
#header{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);
  padding:14px 16px 12px;border-bottom:none;flex-shrink:0;
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
}
.header-top{display:flex;justify-content:space-between;align-items:center;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:40px;height:40px;border-radius:12px;overflow:hidden;flex-shrink:0;box-shadow:0 3px 10px rgba(200,150,60,0.4);display:flex;align-items:center;justify-content:center;}
.brand-text{line-height:1.2;}
.brand-name{font-size:17px;font-weight:900;color:#fff;letter-spacing:0.3px;}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.55);font-weight:500;letter-spacing:1px;text-transform:uppercase;}
.hright{display:flex;align-items:center;gap:8px;}
/* Avatar seule - cercle cliquable */
.user-avatar-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;cursor:pointer;border:2px solid rgba(255,255,255,0.3);flex-shrink:0;}
/* Plus button */
.btn-plus{background:rgba(255,255,255,0.15);backdrop-filter:blur(4px);border:1.5px solid rgba(255,255,255,0.25);color:#fff;border-radius:12px;width:36px;height:36px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.btn-plus:active{background:rgba(255,255,255,0.25);}
/* BELL */
.bell-wrap{position:relative;cursor:pointer;}
.bell-btn{background:rgba(255,255,255,0.12);backdrop-filter:blur(4px);border:1.5px solid rgba(255,255,255,0.22);border-radius:12px;width:36px;height:36px;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.bell-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #1a1a2e;}
/* Sync - minimal, inside header */
#sync-bar{display:none;} /* hidden - status in bell only */
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sdot.online{background:#059669;}.sdot.offline{background:#dc2626;}.sdot.syncing{background:#d97706;animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* CONTENT & NAV */
#content{flex:1;overflow-y:auto;padding:14px 14px 80px;-webkit-overflow-scrolling:touch;background:var(--bg);}
#nav{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a1a2e 0%,#2d1832 100%);border-top:1.5px solid rgba(232,185,106,0.25);display:flex;padding:8px 0 env(safe-area-inset-bottom,14px);box-shadow:0 -4px 20px rgba(0,0,0,0.25);}
.nbtn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;}
.nbtn-icon{font-size:20px;}.nbtn-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.45);}
.nbtn.active .nbtn-label{color:#e8b96a;}
.ndot{width:4px;height:4px;border-radius:50%;background:#e8b96a;margin-top:1px;display:none;}
.nbtn.active .ndot{display:block;}

/* CARDS */
.rcard{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);}
.rcard.pending{border-color:#fed7aa;background:#fffbf5;}
.rcard.approved{border-color:#a7f3d0;background:#f0fdf9;}
.rcard.pending-delete{border-color:#fca5a5;background:#fff5f5;}
.rcard.pending-edit{border-color:#c4b5fd;background:#faf5ff;}
.rcard:active{opacity:0.85;}
.status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;margin-top:3px;display:inline-block;}
.sb-pending{background:#fed7aa;color:#92400e;}
.sb-approved{background:#a7f3d0;color:#065f46;}
.sb-edit{background:#ddd6fe;color:#5b21b6;}
.sb-delete{background:#fca5a5;color:#991b1b;}
.rring{position:relative;width:44px;height:44px;flex-shrink:0;margin-top:2px;}
.rring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;}
.rinfo{flex:1;min-width:0;}
.rname{font-weight:700;font-size:14px;line-height:1.3;color:var(--text);}
.rmeta{color:var(--text2);font-size:11px;margin-top:3px;}
.rmoney{color:var(--text2);font-size:11px;margin-top:2px;}
.rdelapart{color:var(--blue);font-size:11px;margin-top:2px;}
.robs{color:var(--text3);font-size:10px;margin-top:2px;font-style:italic;}
.rcreator{color:var(--text3);font-size:10px;margin-top:2px;}

/* CALENDAR */
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-nbtn{background:#fdf6ec;border:1.5px solid #d4a857;color:#6b4c2a;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer;line-height:1;box-shadow:var(--shadow);}
.cal-title{font-size:17px;font-weight:800;color:var(--text);}
.cal-dh{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;}
.cal-dn{text-align:center;font-size:10px;color:var(--text3);font-weight:700;padding:3px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.ccell{min-height:46px;border-radius:9px;padding:5px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;}
.ccell.free{background:#edf7f0;border:1.5px solid #a7f3d0;}
.ccell.reserved{background:#fef2f2;border:1.5px solid #fca5a5;}
.ccell.today{background:var(--blue-bg);border:2px solid var(--blue);}
.ccell.empty{background:none;border:none;cursor:default;}
.cnum{font-size:12px;font-weight:500;}
.cnum.free{color:#059669;}.cnum.reserved{color:#dc2626;}.cnum.today{color:var(--blue);font-weight:800;}
.cdots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;}
.cdot{width:7px;height:7px;border-radius:50%;}
.ccount{font-size:8px;color:var(--orange);font-weight:700;margin-top:1px;}
.cal-legend{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.legsq{width:11px;height:11px;border-radius:3px;display:inline-block;}
.legdot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* DASHBOARD */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.kcard{background:#fdf6ec;border:1px solid #e2cfa8;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
.dblock{background:#fdf6ec;border:1.5px solid #e2cfa8;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.dbtitle{color:var(--text2);font-size:11px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
.bar-row{display:flex;align-items:flex-end;gap:3px;height:88px;}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.prbar{height:7px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px;}
.prfill{height:100%;border-radius:3px;}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.tbadge{background:var(--blue-bg);color:var(--blue);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}.overlay.centered{align-items:center;padding:20px;}
.sheet{background:#fdf6ec;border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:94vh;overflow-y:auto;padding:20px 18px 50px;box-shadow:0 -8px 30px rgba(92,42,78,0.18);-webkit-overflow-scrolling:touch;border-top:2px solid #e8b96a;}
.sheet-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.btn-back{background:#fdf6ec;border:1.5px solid #d4a857;color:#6b4c2a;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow);}
.sheet-title{font-size:17px;font-weight:700;margin-left:10px;color:var(--text);}
.btn-del{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:700;}
.btn-approve{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:700;}
.btn-reject{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:700;}

/* FORM */
.fg{margin-bottom:12px;}
/* Autocomplete dropdown natif */
datalist{display:none;}
input[list]::-webkit-calendar-picker-indicator{opacity:0.5;cursor:pointer;}
.fl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px;}
.fi{display:block;width:100%;background:#fff8f0;border:1.5px solid #d4a857;border-radius:10px;padding:10px 12px;color:#2c1f0e;font-size:16px;outline:none;font-family:inherit;-webkit-appearance:none;}
.fi:focus{border-color:#8b3a6b;box-shadow:0 0 0 3px rgba(139,58,107,0.12);}
.fi:disabled{background:var(--bg);color:var(--text3);cursor:not-allowed;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
.dlg{margin-bottom:12px;background:#fffbf5;border:1.5px solid #f5c87a;border-radius:12px;padding:11px 13px;}
.dll{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:5px;}
.dli{display:block;width:100%;background:var(--card);border:1.5px solid #f5c87a;border-radius:10px;padding:10px 12px;color:var(--text);font-size:16px;outline:none;font-family:inherit;-webkit-appearance:none;}
.dli:focus{border-color:var(--gold);}
.dli:disabled{background:var(--bg);color:var(--text3);}
input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer;margin-top:6px;}
input[type=range]:disabled{opacity:0.4;}
.pdisplay{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px;margin-bottom:16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);}
.pring{position:relative;width:54px;height:54px;flex-shrink:0;}
.pring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.bsave{width:100%;padding:15px;cursor:pointer;background:linear-gradient(135deg,#5c2a4e,#8b3a6b);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:800;font-family:inherit;box-shadow:0 4px 14px rgba(92,42,78,0.3);}
.bsave.pending-save{background:linear-gradient(135deg,#92400e,#d97706);}
.bsave.danger-save{background:linear-gradient(135deg,#991b1b,#dc2626);}
.pending-notice{background:#fffbeb;border:1.5px solid #fde68a;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px;color:#92400e;line-height:1.5;}

/* DIALOG */
.dbox{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:26px;width:100%;max-width:320px;text-align:center;box-shadow:var(--shadow2);}
.bconfirm{width:100%;padding:13px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none;border-radius:12px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.bdiscard{width:100%;padding:13px;background:var(--red-bg);border:1px solid #fca5a5;border-radius:12px;color:var(--red);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.bcancel{width:100%;padding:10px;background:none;border:none;color:var(--text3);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
.empty{text-align:center;color:var(--text3);padding:50px 20px;}

/* TEAM */
.ucard{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.urole{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;}
.urole.admin{background:#ede9fe;color:#6d28d9;}
.urole.employe{background:#e0f2fe;color:#0369a1;}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.btn-sm.danger{background:var(--red-bg);color:var(--red);border:1px solid #fca5a5;}
.btn-sm.neutral{background:var(--blue-bg);color:var(--blue);border:1px solid #bfdbfe;}
.pending-banner{background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:11px 13px;margin-bottom:12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
</style>
</head>

<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const CAP=200;
const MFR=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const MFULL=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DFR=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const SK_LOCAL='khManagement_local';
const SK_SESSION='khManagement_session';
const FB_URL='https://kh-management-default-rtdb.europe-west1.firebasedatabase.app';

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2);}
function dimM(y,m){return new Date(y,m+1,0).getDate();}
function fdM(y,m){let d=new Date(y,m,1).getDay();return d===0?6:d-1;}
function fmt(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function pct(p,a){p=parseFloat(p)||0;a=parseFloat(a)||0;if(!p)return 0;return Math.min(100,Math.round((a/p)*100));}
function pcol(v){return v===100?'#059669':v>=50?'#d97706':'#dc2626';}
function plbl(v){return v===100?'Soldé':v>0?'Partiel':'Impayé';}
function tstr(){return new Date().toISOString().slice(0,10);}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function hashPwd(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h.toString(36);}
function fmtDH(v){return(parseFloat(v)||0).toLocaleString('fr-MA')+' DH';}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let reservations=[];
let users={};
let currentUser=null;
let tab='dashboard';
const _now=new Date();let calYear=_now.getFullYear(),calMonth=_now.getMonth();
let editingId=null,formSnap='';
let isOnline=false;
let sseSource=null,sseTimer=null;
let isSaving=false;
let _writeToken=null; // token de la dernière écriture locale
let _writeTs=0;       // timestamp de la dernière écriture locale // Flag to ignore SSE events while writing
let resetPwdTarget=null;

// ═══════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════
function loadLocal(){try{const r=localStorage.getItem(SK_LOCAL);if(r)return JSON.parse(r);}catch(e){}return[];}
function saveLocal(){try{localStorage.setItem(SK_LOCAL,JSON.stringify(reservations));}catch(e){}}
function loadSession(){try{const s=localStorage.getItem(SK_SESSION);if(s)return JSON.parse(s);}catch(e){}return null;}
function saveSession(u){try{localStorage.setItem(SK_SESSION,JSON.stringify(u));}catch(e){}}
function clearSession(){try{localStorage.removeItem(SK_SESSION);}catch(e){}}

// ═══════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════
function fbUrl(p){return FB_URL+p+'.json';}
function setSync(state,text){
  const d=document.getElementById('sdot'),t=document.getElementById('stext');
  if(!d)return;d.className='sdot '+state;t.textContent=text;
}
async function fbGet(p){const r=await fetch(fbUrl(p));if(!r.ok)throw new Error(r.status);return r.json();}
async function fbSet(p,d){const r=await fetch(fbUrl(p),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error(r.status);}
async function fbPatch(p,d){const r=await fetch(fbUrl(p),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error(r.status);}
async function fbDelete(p){const r=await fetch(fbUrl(p),{method:'DELETE'});if(!r.ok)throw new Error(r.status);}

async function loadUsers(){
  try{
    const d=await fbGet('/users');
    if(d)users=d;
    else{users={admin:{username:'admin',passwordHash:hashPwd('admin1234'),role:'admin',displayName:'Administrateur',mustChangePwd:false}};await fbSet('/users',users);}
  }catch(e){users={admin:{username:'admin',passwordHash:hashPwd('admin1234'),role:'admin',displayName:'Administrateur',mustChangePwd:false}};}
}
async function saveUser(uname,data){users[uname]=data;try{await fbPatch('/users',{[uname]:data});}catch(e){}}

async function fbWriteRes(){
  const obj={};reservations.forEach(r=>obj[r.id]=r);
  try{
    isSaving=true;_writeTs=Date.now();
    setSync('syncing','Synchronisation...');
    await fbSet('/reservations',obj);
    setSync('online','Temps réel ✓');isOnline=true;
  }catch(e){setSync('offline','Hors ligne');isOnline=false;}
  finally{
    // Bloquer SSE seulement 1.5s (juste le temps que Firebase renvoie notre propre event)
    // Au-delà, les events viennent d'autres appareils et doivent être traités
    setTimeout(()=>{isSaving=false;_writeTs=0;},5000); // 5s pour couvrir réseaux lents
  }
}
async function fbReadOnce(){
  try{
    setSync('syncing','Chargement...');
    const d=await fbGet('/reservations');
    if(d){reservations=Object.values(d);let fix=false;
      reservations=reservations.map(r=>{if(!r.delapart||!r.delapart.trim()){fix=true;return{...r,delapart:'à remplir'};}return r;});
      if(fix)await fbWriteRes();}
    saveLocal();setSync('online','Temps réel ✓');isOnline=true;renderContent();updateBell();
  }catch(e){setSync('offline','Hors ligne — données locales');isOnline=false;}
}
function startSSE(){
  if(sseSource)sseSource.close();if(sseTimer)clearTimeout(sseTimer);
  try{
    // SSE pour les réservations
    sseSource=new EventSource(fbUrl('/reservations'));
    sseSource.addEventListener('put',function(e){
      try{
        const msg=JSON.parse(e.data);
        const now=Date.now();
        const isOurOwnWrite=isSaving&&(now-_writeTs)<1500;

        // Suppressions sur chemin précis : toujours traiter (vient d'un autre appareil)
        if(msg.path!=='/'&&msg.data===null){
          const id=msg.path.replace('/','');
          reservations=reservations.filter(r=>r.id!==id);
          saveLocal();setSync('online','Temps réel ✓');isOnline=true;renderContent();updateBell();
          return;
        }
        // Mise à jour sur chemin précis
        if(msg.path!=='/'&&msg.data!==null){
          if(isOurOwnWrite)return; // notre propre écriture récente, ignorer
          const id=msg.path.replace('/','');
          const i=reservations.findIndex(r=>r.id===id);
          // Anti-doublon : ne pusher que si l'ID n'existe pas encore localement
          if(i>=0)reservations[i]=msg.data;
          else if(!reservations.some(r=>r.id===id))reservations.push(msg.data);
          saveLocal();setSync('online','Temps réel ✓');isOnline=true;renderContent();updateBell();
          return;
        }
        // PUT global sur '/' : si c'est notre propre écriture, ignorer; sinon traiter
        if(msg.data===null)return;
        if(msg.path==='/'){
          if(isOurOwnWrite)return; // notre propre PUT global, ignorer
          if(msg.data)reservations=Object.values(msg.data);else reservations=[];
          saveLocal();setSync('online','Temps réel ✓');isOnline=true;renderContent();updateBell();
        }
      }catch(err){}
    });
    sseSource.addEventListener('patch',function(e){
      try{
        const now=Date.now();
        if(isSaving&&(now-_writeTs)<1500)return; // notre propre écriture
        const msg=JSON.parse(e.data);if(msg.data){Object.entries(msg.data).forEach(([id,val])=>{
          if(val===null)reservations=reservations.filter(r=>r.id!==id);
          else{const i=reservations.findIndex(r=>r.id===id);
            // Anti-doublon : ne pusher que si l'ID n'existe pas encore
            if(i>=0)reservations[i]=val;
            else if(!reservations.some(r=>r.id===id))reservations.push(val);
          }});
        saveLocal();setSync('online','Temps réel ✓');isOnline=true;renderContent();updateBell();}
      }catch(err){}
    });
    sseSource.onerror=function(){setSync('syncing','Reconnexion...');sseSource.close();sseSource=null;sseTimer=setTimeout(startSSE,5000);};

    // SSE séparé pour /users (mise à jour équipe en temps réel)
    const sseUsers=new EventSource(fbUrl('/users'));
    sseUsers.addEventListener('put',function(e){
      try{
        const msg=JSON.parse(e.data);
        if(msg.data===null)return;
        if(msg.path==='/')users=msg.data;
        else{const u=msg.path.replace('/','');if(msg.data===null)delete users[u];else users[u]=msg.data;}
        if(currentUser.role==='admin')renderContent();
      }catch(err){}
    });
    sseUsers.addEventListener('patch',function(e){
      try{
        const msg=JSON.parse(e.data);
        if(msg.data){Object.entries(msg.data).forEach(([u,val])=>{if(val===null)delete users[u];else users[u]=val;});}
        if(currentUser.role==='admin')renderContent();
      }catch(err){}
    });
    sseUsers.onerror=function(){sseUsers.close();};
  }catch(e){setInterval(fbReadOnce,10000);}
}
async function save(){saveLocal();await fbWriteRes();}

// ═══════════════════════════════════════════════
// BELL / NOTIFICATIONS
// ═══════════════════════════════════════════════
function pendingCount(){
  return reservations.filter(r=>
    r.status==='pending'||r.status==='pending-edit'||r.status==='pending-delete'
  ).length;
}
function updateBell(){
  if(!currentUser||currentUser.role!=='admin')return;
  const cnt=pendingCount();
  const badge=document.getElementById('bell-badge');
  const wrap=document.getElementById('bell-wrap');
  if(!badge||!wrap)return;
  wrap.style.display='';
  if(cnt>0){badge.style.display='flex';badge.textContent=cnt>9?'9+':cnt;}
  else{badge.style.display='none';}
}

// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
function initLogin(){
  const btn=document.getElementById('btn-login');
  const err=document.getElementById('login-err');
  async function doLogin(){
    const u=document.getElementById('l-user').value.trim().toLowerCase();
    const p=document.getElementById('l-pwd').value;
    err.style.display='none';
    if(!u||!p){err.textContent='Veuillez remplir tous les champs.';err.style.display='block';return;}
    await loadUsers();
    const user=users[u];
    if(!user||user.passwordHash!==hashPwd(p)){err.textContent='Identifiants incorrects.';err.style.display='block';return;}
    currentUser={username:u,role:user.role,displayName:user.displayName||u,mustChangePwd:!!user.mustChangePwd};
    saveSession(currentUser);
    document.getElementById('login-screen').style.display='none';
    if(currentUser.mustChangePwd)showChangePwd(false);else startApp();
  }
  btn.addEventListener('click',doLogin);
  document.getElementById('l-pwd').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

function showChangePwd(fromMenu){
  const scr=document.getElementById('change-pwd-screen');
  scr.style.display='flex';
  const btn=document.getElementById('btn-change-pwd');
  const nb=btn.cloneNode(true);btn.parentNode.replaceChild(nb,btn);
  nb.addEventListener('click',async function(){
    const p1=document.getElementById('new-pwd1').value;
    const p2=document.getElementById('new-pwd2').value;
    const err=document.getElementById('cpwd-err');err.style.display='none';
    if(p1.length<4){err.textContent='Minimum 4 caractères.';err.style.display='block';return;}
    if(p1!==p2){err.textContent='Les mots de passe ne correspondent pas.';err.style.display='block';return;}
    users[currentUser.username].passwordHash=hashPwd(p1);
    users[currentUser.username].mustChangePwd=false;
    currentUser.mustChangePwd=false;
    await saveUser(currentUser.username,users[currentUser.username]);
    saveSession(currentUser);
    scr.style.display='none';
    document.getElementById('new-pwd1').value='';document.getElementById('new-pwd2').value='';
    if(!fromMenu)startApp();
  });
}
function openChangePwdFromMenu(){closeOverlay('ov-user-menu');showChangePwd(true);}
function logout(){
  clearSession();currentUser=null;
  if(sseSource)sseSource.close();
  closeOverlay('ov-user-menu');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('l-user').value='';document.getElementById('l-pwd').value='';
}
function openUserMenu(){
  if(!currentUser)return;
  document.getElementById('um-avatar').textContent=initials(currentUser.displayName);
  document.getElementById('um-name').textContent=currentUser.displayName;
  document.getElementById('um-role').textContent=currentUser.role==='admin'?'👑 Administrateur':'👤 Employé';
  openOverlay('ov-user-menu');
}

// ═══════════════════════════════════════════════
// START APP
// ═══════════════════════════════════════════════
function startApp(){
  document.getElementById('app').style.display='flex';
  const av=document.getElementById('user-avatar');
  av.textContent=initials(currentUser.displayName).charAt(0); // just first letter
  av.style.background=currentUser.role==='admin'?'#7c3aed':'#2563eb';
  av.title=currentUser.displayName;
  document.getElementById('btn-main-add').style.display='flex';
  if(currentUser.role==='admin')document.getElementById('bell-wrap').style.display='';
  // Set default tab per role
  tab=currentUser.role==='admin'?'dashboard':'calendar';
  buildNav();attachFormListeners();initImport();
  reservations=loadLocal();renderContent();updateBell();
  fbReadOnce().then(()=>startSSE());
}

// ═══════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════
function buildNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  const tabs=currentUser.role==='admin'
    ?[['dashboard','📊','Dashboard'],['calendar','🗓️','Calendrier'],['list','📋','Liste'],['users','👥','Équipe']]
    :[['calendar','🗓️','Calendrier'],['list','📋','Mes rés.']];
  tabs.forEach(([id,icon,label])=>{
    const b=document.createElement('button');
    b.className='nbtn'+(id===tab?' active':'');b.id='nb-'+id;
    b.innerHTML=`<span class="nbtn-icon">${icon}</span><span class="nbtn-label">${label}</span><span class="ndot"></span>`;
    b.addEventListener('click',()=>setTab(id));nav.appendChild(b);
  });
}
function setTab(t){
  tab=t;
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nb-'+t);if(nb)nb.classList.add('active');
  renderContent();
}

// ═══════════════════════════════════════════════
// SVG RING
// ═══════════════════════════════════════════════
function ring(v,size,col){
  const r=(size-4)/2,c=2*Math.PI*r,d=(v/100)*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e8e0d5" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${d} ${c}" stroke-linecap="round"/></svg>`;
}

// ═══════════════════════════════════════════════
// CARD
// ═══════════════════════════════════════════════
function statusBadge(r){
  const status=r.status;
  if(!status||status==='approved')return'';
  if(status==='pending')return'<span class="status-badge sb-pending">⏳ En attente</span>';
  if(status==='pending-edit'){
    const s=r.changesSummary?'<div style="font-size:9px;color:#5b21b6;margin-top:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+r.changesSummary+'</div>':'';
    return'<span class="status-badge sb-edit">✏️ Modif. en attente</span>'+s;
  }
  if(status==='pending-delete')return'<span class="status-badge sb-delete">🗑️ Suppr. en attente</span>';
  return'';
}
function cardClass(status){
  if(status==='pending')return' pending';
  if(status==='pending-edit')return' pending-edit';
  if(status==='pending-delete')return' pending-delete';
  if(status==='approved')return' approved';
  return'';
}
function cardHTML(r){
  const v=pct(r.prix,r.avance),col=pcol(v);
  return `<div class="rcard${cardClass(r.status)}" data-id="${r.id}">
    <div class="rring">${ring(v,44,col)}<span class="rring-pct" style="color:${col}">${v}%</span></div>
    <div class="rinfo">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:4px">
        <span class="rname">${r.nom||'—'}</span>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0">
          ${statusBadge(r)}
        </div>
      </div>
      <div class="rmeta">📅 ${fmt(r.date)}${r.tel?' · 📞 '+r.tel:''}</div>
      ${r.prix>0?`<div class="rmoney">💰 ${fmtDH(r.prix)} · Avance: ${fmtDH(r.avance)}</div>`:''}
      ${r.delapart?`<div class="rdelapart">⭐ De la part: <b>${r.delapart}</b></div>`:''}
      ${r.traiteur||r.neggafa?`<div class="rmeta">${r.traiteur?'🍽️ '+r.traiteur+(r.traiteurType==='interne'&&r.prixTable?' ('+r.prixTable+' DH/table)':''):'' }${r.traiteur&&r.neggafa?' · ':''}${r.neggafa?'💄 '+r.neggafa:''}</div>`:''}
      ${r.observation?`<div class="robs">📝 ${r.observation}</div>`:''}
      ${r.createdBy&&currentUser.role==='admin'?`<div class="rcreator" style="display:flex;justify-content:space-between;align-items:center">
        <span>👤 ${users[r.createdBy]?.displayName||r.createdBy}</span>
        <button onclick="event.stopPropagation();printReservationPDF(reservations.find(x=>x.id==='${r.id}'))" style="background:none;border:1px solid var(--border2);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--text2)">🖨️</button>
      </div>`:''
      }${currentUser.role!=='admin'?`<button onclick="event.stopPropagation();printReservationPDF(reservations.find(x=>x.id==='${r.id}'))" style="margin-top:6px;background:none;border:1px solid var(--border2);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--text2);display:block">🖨️ Imprimer</button>`:''}
    </div>
  </div>`;
}
function bindCards(container,afterClick){
  container.querySelectorAll('.rcard').forEach(el=>{
    el.addEventListener('click',()=>{if(afterClick)afterClick();openForm(el.dataset.id);});
  });
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function renderContent(){
  const el=document.getElementById('content');if(!el)return;
  if(tab==='dashboard')renderDashboard(el);
  else if(tab==='calendar')renderCalendar(el);
  else if(tab==='list')renderList(el);
  else if(tab==='users')renderUsers(el);
}

// ── DASHBOARD ──
function renderDashboard(el){
  const isAdmin=currentUser.role==='admin';
  const myRes=isAdmin?reservations:reservations.filter(r=>r.createdBy===currentUser.username&&r.status!=='pending-delete');
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth();
  const monthly=MFR.map((label,mi)=>{
    const res=myRes.filter(r=>{const d=new Date(r.date);return d.getFullYear()===cy&&d.getMonth()===mi;});
    return{label,revenue:res.reduce((s,r)=>s+r.prix,0),collected:res.reduce((s,r)=>s+r.avance,0),count:res.length};
  });
  const myRes2=myRes.filter(r=>r.date);
  const tRev=myRes.reduce((s,r)=>s+(r.prix||0),0);
  const tCol=myRes.reduce((s,r)=>s+r.avance,0);
  const thisM=monthly[cm];
  const thisRes=myRes.filter(r=>{const d=new Date(r.date);return d.getFullYear()===cy&&d.getMonth()===cm;});
  const occDays=new Set(thisRes.map(r=>r.date)).size;
  const dIM=dimM(cy,cm),maxRev=Math.max(...monthly.map(m=>m.revenue),1);
  const occRate=Math.round((occDays/dIM)*100);

  let topSections='';
  if(isAdmin){
    const dlC={},trC={},ngC={};
    myRes.forEach(r=>{
      if(r.delapart?.trim())dlC[r.delapart]=(dlC[r.delapart]||0)+1;
      if(r.traiteur?.trim())trC[r.traiteur]=(trC[r.traiteur]||0)+1;
      if(r.neggafa?.trim())ngC[r.neggafa]=(ngC[r.neggafa]||0)+1;
    });
    const topDl=Object.entries(dlC).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const topTr=Object.entries(trC).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const topNg=Object.entries(ngC).sort((a,b)=>b[1]-a[1]).slice(0,4);
    if(topDl.length)topSections+=`<div class="dblock"><div class="dbtitle">⭐ Top apporteurs d'affaires</div>${topDl.map(([n,c])=>`<div class="trow"><span style="color:var(--text);font-size:13px">${n}</span><span class="tbadge">${c} rés.</span></div>`).join('')}</div>`;
    // Traiteur interne stats
    const trInterneRes=myRes.filter(r=>r.traiteurType==='interne'&&r.prixTable>0);
    const trInterneRev=trInterneRes.reduce((s,r)=>s+(r.prixTable||0)*(r.tables||0),0);
    const trInterneCount=trInterneRes.length;
    if(trInterneCount>0)topSections+=`<div class="dblock"><div class="dbtitle">🍽️ Traiteur Interne</div>
      <div class="trow"><span style="color:var(--text);font-size:13px">Réservations</span><span class="tbadge" style="background:#ecfdf5;color:#059669">${trInterneCount} rés.</span></div>
      <div class="trow"><span style="color:var(--text);font-size:13px">Revenus traiteur</span><span class="tbadge" style="background:#ecfdf5;color:#059669">${fmtDH(trInterneRev)}</span></div>
    </div>`;
    if(topTr.length)topSections+=`<div class="dblock"><div class="dbtitle">🍽️ Traiteurs les plus demandés</div>${topTr.map(([n,c])=>`<div class="trow"><span style="color:var(--text);font-size:13px">${n}</span><span class="tbadge" style="background:#ecfdf5;color:#059669">${c} rés.</span></div>`).join('')}</div>`;
    if(topNg.length)topSections+=`<div class="dblock"><div class="dbtitle">💄 Neggafas les plus demandées</div>${topNg.map(([n,c])=>`<div class="trow"><span style="color:var(--text);font-size:13px">${n}</span><span class="tbadge" style="background:#fdf4ff;color:#7c3aed">${c} rés.</span></div>`).join('')}</div>`;
  }

  const kpis=isAdmin
    ?[{l:'Revenus total',v:fmtDH(tRev),i:'💰',c:'#2563eb',bg:'#eff6ff'},{l:'Encaissé',v:fmtDH(tCol),i:'✅',c:'#059669',bg:'#ecfdf5'},{l:'En attente',v:fmtDH(tRev-tCol),i:'⏳',c:'#d97706',bg:'#fffbeb'},{l:'Réservations',v:myRes.length,i:'📋',c:'#7c3aed',bg:'#f5f3ff'}]
    :[{l:'Mes réservations',v:myRes.length,i:'📋',c:'#2563eb',bg:'#eff6ff'},{l:'Approuvées',v:myRes.filter(r=>r.status==='approved'||!r.status).length,i:'✅',c:'#059669',bg:'#ecfdf5'},{l:'En attente',v:myRes.filter(r=>r.status&&r.status!=='approved').length,i:'⏳',c:'#d97706',bg:'#fffbeb'},{l:'Ce mois',v:thisM.count,i:'📅',c:'#7c3aed',bg:'#f5f3ff'}];

  const backupSection=isAdmin?`<div class="dblock">
    <div class="dbtitle">💾 Sauvegarde & Restauration</div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.5">Exportez vos données. En cas de perte, importez le fichier pour tout restaurer.</p>
    <button onclick="exportBackup()" style="width:100%;padding:12px;background:linear-gradient(135deg,#059669,#10b981);border:none;border-radius:11px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:8px">📥 Exporter la sauvegarde (JSON)</button>
    <button onclick="document.getElementById('import-file').click()" style="width:100%;padding:12px;background:#fff;border:2px solid #d97706;border-radius:11px;color:#d97706;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit">📤 Importer une sauvegarde (JSON)</button>
    <div id="import-status" style="margin-top:8px;font-size:12px;text-align:center;display:none"></div>
  </div>`:'';

  el.innerHTML=`<h2 style="font-size:18px;font-weight:800;margin-bottom:14px;color:var(--text)">📊 Tableau de bord</h2>
  <div class="kgrid">${kpis.map(k=>`<div class="kcard" style="border:1.5px solid ${k.c}33;background:${k.bg}">
    <div style="font-size:20px">${k.i}</div>
    <div style="color:${k.c};font-weight:800;font-size:15px;margin-top:5px">${k.v}</div>
    <div style="color:#6b5a47;font-size:10px;margin-top:2px">${k.l}</div>
  </div>`).join('')}</div>
  <div class="dblock"><div class="dbtitle">Taux d'occupation — ${MFULL[cm]}</div>
    <div style="display:flex;justify-content:space-between;margin-bottom:5px">
      <span style="font-size:13px;font-weight:600;color:var(--text)">🎊 Salle de Fêtes</span>
      <span style="color:#2563eb;font-weight:800;font-size:13px">${occRate}%</span>
    </div>
    <div class="prbar" style="height:10px"><div class="prfill" style="width:${occRate}%;background:#2563eb"></div></div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px;text-align:center">${occDays} jour(s) réservé(s) sur ${dIM}</div>
  </div>
  ${topSections}
  <div class="dblock"><div class="dbtitle">Revenus par mois — ${cy}</div>
    <div class="bar-row">${monthly.map((m,i)=>{const h=Math.max(3,(m.revenue/maxRev)*84),isNow=i===cm;
      return`<div class="bcol"><div style="width:100%;height:${h}px;background:${isNow?'linear-gradient(180deg,#3b82f6,#1d4ed8)':m.revenue>0?'#bfdbfe':'#e8e0d5'};border-radius:3px 3px 0 0;border:${isNow?'1px solid #2563eb':'none'}"></div>
      <span style="font-size:7px;color:${isNow?'#2563eb':'#a09080'};font-weight:${isNow?700:400}">${m.label}</span></div>`;}).join('')}</div>
    ${thisM.revenue>0?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e8e0d5;display:flex;justify-content:space-between">
      ${[{l:'Réservations',v:thisM.count},{l:'Revenus',v:fmtDH(thisM.revenue)},{l:'Encaissé',v:fmtDH(thisM.collected)}].map(x=>`
      <div style="text-align:center"><div style="font-weight:800;font-size:12px;color:var(--text)">${x.v}</div><div style="color:#a09080;font-size:9px">${x.l}</div></div>`).join('')}</div>`:''}
  </div>
  ${backupSection}`;
}

// ── CALENDAR ──
function renderCalendar(el){
  const resByDate={};
  // All roles see all reservations on calendar to avoid booking conflicts
  // Employees can still only open/edit their own
  reservations.forEach(r=>{if(!r.date)return;if(!resByDate[r.date])resByDate[r.date]=[];resByDate[r.date].push(r);});
  const nd=dimM(calYear,calMonth),fday=fdM(calYear,calMonth),todayKey=tstr();
  let cells='';
  for(let i=0;i<fday;i++)cells+='<div class="ccell empty"></div>';
  for(let d=1;d<=nd;d++){
    const dk=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ents=resByDate[dk]||[];const hasRes=ents.length>0,isToday=dk===todayKey;
    const cls='ccell '+(isToday?'today':hasRes?'reserved':'free');
    const ncls='cnum '+(isToday?'today':hasRes?'reserved':'free');
    const hasPending=ents.some(r=>r.status&&r.status!=='approved');
    cells+=`<div class="${cls}" data-date="${dk}">
      <span class="${ncls}">${d}</span>
      ${hasRes?`<div class="cdots">
        <div class="cdot" style="background:#2563eb"></div>
        ${hasPending?`<div class="cdot" style="background:#d97706"></div>`:''}
      </div>`:''}
      ${ents.length>1?`<div class="ccount">${ents.length}</div>`:''}
    </div>`;
  }
  el.innerHTML=`<div>
    <div class="cal-nav">
      <button class="cal-nbtn" id="cal-prev">‹</button>
      <span class="cal-title">${MFULL[calMonth]} ${calYear}</span>
      <button class="cal-nbtn" id="cal-next">›</button>
    </div>
    <div class="cal-dh">${DFR.map(d=>`<div class="cal-dn">${d}</div>`).join('')}</div>
    <div class="cal-grid" id="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span class="leg"><span class="legsq" style="background:#edf7f0;border:1.5px solid #a7f3d0"></span>Libre</span>
      <span class="leg"><span class="legsq" style="background:#fef2f2;border:1.5px solid #fca5a5"></span>Réservé</span>
      <span class="leg"><span class="legdot" style="background:#d97706"></span>En attente</span>
    </div>
  </div>`;
  document.getElementById('cal-prev').addEventListener('click',()=>{if(calMonth===0){calMonth=11;calYear--;}else calMonth--;renderContent();});
  document.getElementById('cal-next').addEventListener('click',()=>{if(calMonth===11){calMonth=0;calYear++;}else calMonth++;renderContent();});
  document.getElementById('cal-grid').querySelectorAll('.ccell:not(.empty)').forEach(c=>{c.addEventListener('click',()=>openDaySheet(c.dataset.date));});
}

// ── LIST ──
function renderList(el){
  const isAdmin=currentUser.role==='admin';
  let list=isAdmin?[...reservations]:reservations.filter(r=>r.createdBy===currentUser.username);

  // Filtres actifs
  const fMois=el._fMois||'';
  const fAnnee=el._fAnnee||'';
  const fTraiteur=el._fTraiteur||'';
  const fNeggafa=el._fNeggafa||'';
  const fDelapart=el._fDelapart||'';

  if(fMois)list=list.filter(r=>r.date&&r.date.slice(5,7)===fMois);
  if(fAnnee)list=list.filter(r=>r.date&&r.date.slice(0,4)===fAnnee);
  if(fTraiteur)list=list.filter(r=>(r.traiteur||'').toLowerCase().includes(fTraiteur.toLowerCase()));
  if(fNeggafa)list=list.filter(r=>(r.neggafa||'').toLowerCase().includes(fNeggafa.toLowerCase()));
  if(fDelapart)list=list.filter(r=>(r.delapart||'').toLowerCase().includes(fDelapart.toLowerCase()));

  list.sort((a,b)=>{
    const ap=a.status&&a.status!=='approved'?0:1;
    const bp=b.status&&b.status!=='approved'?0:1;
    if(ap!==bp)return ap-bp;
    return (a.date||'').localeCompare(b.date||'');
  });

  const pending=list.filter(r=>r.status&&r.status!=='approved');
  const annees=[...new Set(reservations.map(r=>r.date?.slice(0,4)).filter(Boolean))].sort().reverse();
  const traiteurs=[...new Set(reservations.map(r=>r.traiteur||'').filter(Boolean))].sort();
  const neggafas=[...new Set(reservations.map(r=>r.neggafa||'').filter(Boolean))].sort();
  const delaparts=[...new Set(reservations.map(r=>r.delapart||'').filter(Boolean))].sort();
  const mois=[{v:'01',l:'Janvier'},{v:'02',l:'Février'},{v:'03',l:'Mars'},{v:'04',l:'Avril'},
    {v:'05',l:'Mai'},{v:'06',l:'Juin'},{v:'07',l:'Juillet'},{v:'08',l:'Août'},
    {v:'09',l:'Septembre'},{v:'10',l:'Octobre'},{v:'11',l:'Novembre'},{v:'12',l:'Décembre'}];

  const hasFilter=fMois||fAnnee||fTraiteur||fNeggafa||fDelapart;
  let html=`<div style="margin-bottom:14px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <span style="font-size:12px;font-weight:700;color:var(--text2)">🔍 Filtres :</span>
      <select id="fl-mois" style="font-size:12px;padding:5px 8px;border:1.5px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;cursor:pointer">
        <option value="">Tous les mois</option>
        ${mois.map(m=>`<option value="${m.v}"${fMois===m.v?' selected':''}>${m.l}</option>`).join('')}
      </select>
      <select id="fl-annee" style="font-size:12px;padding:5px 8px;border:1.5px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;cursor:pointer">
        <option value="">Toutes les années</option>
        ${annees.map(a=>`<option value="${a}"${fAnnee===a?' selected':''}>${a}</option>`).join('')}
      </select>
      <select id="fl-delapart" style="font-size:12px;padding:5px 8px;border:1.5px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;cursor:pointer">
        <option value="">Tous apporteurs</option>
        ${delaparts.map(d=>`<option value="${d}"${fDelapart===d?' selected':''}>${d}</option>`).join('')}
      </select>
      ${traiteurs.length?`<select id="fl-traiteur" style="font-size:12px;padding:5px 8px;border:1.5px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;cursor:pointer">
        <option value="">Tous traiteurs</option>
        ${traiteurs.map(t=>`<option value="${t}"${fTraiteur===t?' selected':''}>${t}</option>`).join('')}
      </select>`:'<span id="fl-traiteur-ph" style="display:none"></span>'}
      ${neggafas.length?`<select id="fl-neggafa" style="font-size:12px;padding:5px 8px;border:1.5px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;cursor:pointer">
        <option value="">Toutes neggafas</option>
        ${neggafas.map(n=>`<option value="${n}"${fNeggafa===n?' selected':''}>${n}</option>`).join('')}
      </select>`:'<span id="fl-neggafa-ph" style="display:none"></span>'}
      ${hasFilter?`<button onclick="resetFilters()" style="font-size:11px;padding:5px 10px;border:1.5px solid var(--red);border-radius:8px;background:#fff;color:var(--red);cursor:pointer;font-family:inherit;font-weight:700">✕ Réinitialiser</button>`:''}
    </div>
  </div>`;

  if(isAdmin&&pending.length>0){
    html+=`<div class="pending-banner" onclick="void(0)">
      <span style="font-size:22px">🔔</span>
      <div><b>${pending.length} action(s) en attente</b> de votre approbation</div>
    </div>`;
  }
  html+=`<h2 style="font-size:18px;font-weight:800;margin-bottom:12px;color:var(--text)">${isAdmin?'Réservations':'Mes réservations'} <span style="color:#2563eb;font-size:14px">(${list.length})</span></h2>`;
  if(!list.length){html+='<div class="empty"><div style="font-size:36px;margin-bottom:10px">📭</div>Aucune réservation</div>';el.innerHTML=html;}
  else{el.innerHTML=html+list.map(r=>cardHTML(r)).join('');bindCards(el);}

  // Attacher les événements des filtres
  ['fl-mois','fl-annee','fl-delapart','fl-traiteur','fl-neggafa'].forEach(id=>{
    const sel=document.getElementById(id);
    if(sel){sel.addEventListener('change',()=>{
      el._fMois=document.getElementById('fl-mois')?.value||'';
      el._fAnnee=document.getElementById('fl-annee')?.value||'';
      el._fDelapart=document.getElementById('fl-delapart')?.value||'';
      el._fTraiteur=document.getElementById('fl-traiteur')?.value||'';
      el._fNeggafa=document.getElementById('fl-neggafa')?.value||'';
      renderList(el);
    });}
  });

  // Boutons sauvegarde pour employés (admin les a dans le dashboard)
  if(!isAdmin){
    const backupDiv=document.createElement('div');
    backupDiv.style.cssText='margin-top:20px;padding:14px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;';
    backupDiv.innerHTML=`<div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px">💾 Sauvegarde</div>
      <button onclick="exportBackup()" style="width:100%;padding:11px;background:linear-gradient(135deg,#059669,#10b981);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:8px">📥 Exporter (JSON)</button>
      <button onclick="document.getElementById('import-file').click()" style="width:100%;padding:11px;background:#fff;border:2px solid #d97706;border-radius:10px;color:#d97706;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit">📤 Importer (JSON)</button>`;
    el.appendChild(backupDiv);
  }
}
function resetFilters(){
  const el=document.getElementById('content');
  el._fMois='';el._fAnnee='';el._fTraiteur='';el._fNeggafa='';el._fDelapart='';
  renderList(el);
}

// ── USERS ──
function renderUsers(el){
  if(currentUser.role!=='admin'){el.innerHTML='<div class="empty">Accès refusé</div>';return;}
  const employees=Object.entries(users).filter(([u,d])=>d.role!=='admin');
  el.innerHTML=`
    <h2 style="font-size:18px;font-weight:800;margin-bottom:14px;color:var(--text)">👥 Gestion de l'équipe</h2>
    <!-- Create new employee -->
    <div class="dblock">
      <div class="dbtitle">➕ Créer un compte employé</div>
      <div class="fg"><label class="fl">Nom d'utilisateur (identifiant)</label>
        <input class="fi" id="new-uname" type="text" placeholder="Ex: sarah" autocomplete="off" autocapitalize="none"/></div>
      <div class="fg"><label class="fl">Nom affiché</label>
        <input class="fi" id="new-dname" type="text" placeholder="Ex: Sarah Benali" autocomplete="off"/></div>
      <div class="fg"><label class="fl">Mot de passe temporaire</label>
        <input class="fi" id="new-upwd" type="text" placeholder="Sera changé à la 1ère connexion" autocomplete="off"/></div>
      <button onclick="createEmployee()" style="width:100%;padding:12px;background:linear-gradient(135deg,#059669,#10b981);border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit">+ Créer le compte</button>
      <div id="user-msg" style="margin-top:10px;font-size:12px;text-align:center;display:none"></div>
    </div>
    <!-- Admin card -->
    <div class="dbtitle" style="margin-bottom:8px">Comptes actifs</div>
    <div class="ucard" style="background:#f5f3ff;border-color:#ddd6fe">
      <div>
        <div style="font-weight:700;font-size:14px">${currentUser.displayName}</div>
        <div style="font-size:11px;color:var(--text2)">@${currentUser.username}</div>
      </div>
      <span class="urole admin">Admin</span>
    </div>
    <!-- Employee cards -->
    ${employees.length===0
      ?'<div style="text-align:center;color:var(--text3);padding:20px;font-size:13px">Aucun employé créé</div>'
      :employees.map(([u,d])=>`
        <div class="ucard" id="ucard-${u}">
          <div style="flex:1">
            <div style="font-weight:700;font-size:14px">${d.displayName||u}</div>
            <div style="font-size:11px;color:var(--text2)">@${u}</div>
            ${d.mustChangePwd?'<div style="font-size:10px;color:#d97706;margin-top:2px">⚠️ Doit changer son mot de passe</div>':''}
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
            <span class="urole employe">Employé</span>
            <button class="btn-sm neutral" onclick="openResetPwd('${u}')">🔑</button>
            <button class="btn-sm danger" onclick="deleteEmployee('${u}')">✕</button>
          </div>
        </div>`).join('')}
  `;
}

async function createEmployee(){
  const uname=document.getElementById('new-uname').value.trim().toLowerCase();
  const dname=document.getElementById('new-dname').value.trim();
  const pwd=document.getElementById('new-upwd').value.trim();
  const msg=document.getElementById('user-msg');msg.style.display='none';
  if(!uname||!dname||!pwd){msg.style.color='#dc2626';msg.textContent='Tous les champs sont requis.';msg.style.display='block';return;}
  if(users[uname]){msg.style.color='#dc2626';msg.textContent='Ce nom d\'utilisateur existe déjà.';msg.style.display='block';return;}
  await saveUser(uname,{username:uname,passwordHash:hashPwd(pwd),role:'employe',displayName:dname,mustChangePwd:true});
  document.getElementById('new-uname').value='';document.getElementById('new-dname').value='';document.getElementById('new-upwd').value='';
  msg.style.color='#059669';msg.textContent=`✅ Compte "${dname}" créé !`;msg.style.display='block';
  setTimeout(()=>{msg.style.display='none';},3000);
  renderContent();
}

async function deleteEmployee(uname){
  if(!confirm(`Supprimer le compte de ${users[uname]?.displayName||uname} ?`))return;
  delete users[uname];
  try{await fbDelete('/users/'+uname);}catch(e){}
  renderContent();
}

function openResetPwd(uname){
  resetPwdTarget=uname;
  document.getElementById('reset-pwd-title').textContent=`Réinitialiser — ${users[uname]?.displayName||uname}`;
  document.getElementById('reset-pwd-input').value='';

    users[resetPwdTarget].passwordHash=hashPwd(newPwd);

    renderContent();

function attachFormListeners(){
  // Traiteur type toggle
  document.querySelectorAll('input[name="traiteur-type"]').forEach(radio=>{

      const val=radio.value;
      const trNomDiv=document.getElementById('fg-traiteur-nom');

function openForm(id,defaultDate){
  editingId=id||null;
  const isAdmin=currentUser.role==='admin';
  let data,existingRes=null;
  if(id){
    existingRes=reservations.find(r=>r.id===id);if(!existingRes)return;
    data=existingRes;
  }else{
    data={hall:0,nom:'',tel:'',date:defaultDate||tstr(),prix:'',avance:'',tables:10,delapart:'',traiteur:'',neggafa:'',observation:''};
  }
  const status=data.status||'approved';
  const isPending=status==='pending'||status==='pending-edit'||status==='pending-delete';
  const isMyRes=!id||data.createdBy===currentUser.username;

  // Fill inputs
  // Pré-remplir type traiteur
  const trType=data.traiteurType||'';
  if(trType==='interne'||trType==='externe'){
    const trRadio=document.querySelector(`input[name="traiteur-type"][value="${trType}"]`);
    if(trRadio){trRadio.checked=true;trRadio.dispatchEvent(new Event('change'));}
    if(trType==='interne'&&data.prixTable){
      document.getElementById('f-prix-table').value=data.prixTable||'';
    }
  }
  ['f-nom','f-tel','f-date','f-prix','f-avance','f-delapart','f-traiteur','f-neggafa','f-obs'].forEach(fid=>{
    const el=document.getElementById(fid);if(!el)return;
    const key=fid.replace('f-','');
    const map={nom:'nom',tel:'tel',date:'date',prix:'prix',avance:'avance',delapart:'delapart',traiteur:'traiteur',neggafa:'neggafa',obs:'observation'};
    el.value=data[map[key]]||'';
  });
  document.getElementById('f-tables').value=data.tables||10;

  // Title
  document.getElementById('form-title').textContent=id?'Réservation':'Nouvelle réservation';

  // Pending notice
  const notice=document.getElementById('pending-notice');
  notice.style.display='none';
  if(isPending){
    notice.style.display='block';
    if(status==='pending'){
      notice.innerHTML='⏳ <b>Nouvelle réservation en attente</b> d\'approbation par l\'administrateur.';
    } else if(status==='pending-edit'){
      const summary=existingRes?.changesSummary;
      if(summary){
        notice.innerHTML='✏️ <b>Modification en attente :</b><br><span style="font-size:11px;color:#92400e">'+summary+'</span>';
      } else {
        notice.innerHTML='✏️ <b>Modification en attente</b> d\'approbation par l\'administrateur.';
      }
    } else if(status==='pending-delete'){
      notice.innerHTML='🗑️ <b>Demande de suppression</b> en attente d\'approbation par l\'administrateur.';
    }
  }

  // Action buttons
  const actionDiv=document.getElementById('form-action-btns');
  actionDiv.innerHTML='';
  if(isAdmin&&isPending){
    const ab=document.createElement('button');ab.className='btn-approve';ab.textContent='✓ Approuver';
    ab.addEventListener('click',()=>approveRes(status));actionDiv.appendChild(ab);
    const rb=document.createElement('button');rb.className='btn-reject';rb.textContent='✕ Rejeter';
    rb.addEventListener('click',()=>rejectRes(status));actionDiv.appendChild(rb);
  } else if(isAdmin&&id){
    const db=document.createElement('button');db.className='btn-del';db.textContent='Supprimer';
    db.addEventListener('click',()=>deleteResAdmin());actionDiv.appendChild(db);
  } else if(!isAdmin&&isMyRes&&id&&status!=='pending-delete'){
    // Employee can request edit or delete
    if(status==='approved'||status==='pending-edit'){
      const db=document.createElement('button');db.className='btn-del';db.textContent='🗑️ Demander suppression';
      db.addEventListener('click',requestDelete);actionDiv.appendChild(db);
    }
  }

  // Save button
  const saveBtn=document.getElementById('form-save-btn');
  if(!id){
    saveBtn.style.display='';
    saveBtn.textContent=isAdmin?'Créer la réservation':'Soumettre pour validation';
    saveBtn.className=isAdmin?'bsave':'bsave pending-save';
  } else if(isAdmin){
    saveBtn.style.display='';saveBtn.textContent='Enregistrer';saveBtn.className='bsave';
  } else if(isMyRes&&status!=='pending-delete'){
    saveBtn.style.display='';
    saveBtn.textContent=status==='pending-edit'?'Modifier ma demande':'Demander modification';
    saveBtn.className='bsave pending-save';
  } else {
    saveBtn.style.display='none';
  }

  // Readonly for employee viewing others or pending-delete
  const readOnly=!isAdmin&&(!isMyRes||(id&&status==='pending-delete'));
  const inputs=['f-nom','f-tel','f-date','f-prix','f-avance','f-delapart','f-traiteur','f-neggafa','f-obs','f-tables'];
  inputs.forEach(fid=>{const el=document.getElementById(fid);if(el)el.disabled=readOnly;});

  formSnap=JSON.stringify(getFormData());
  updatePayDisplay();
  document.getElementById('sheet-form').scrollTop=0;
  populateAutocomplete();
  openOverlay('ov-form');
}

function getFormData(){
  const trType=document.querySelector('input[name="traiteur-type"]:checked')?.value||'aucun';
  return{nom:document.getElementById('f-nom').value,tel:document.getElementById('f-tel').value,
    date:document.getElementById('f-date').value,prix:document.getElementById('f-prix').value,
    avance:document.getElementById('f-avance').value,tables:document.getElementById('f-tables').value,
    delapart:document.getElementById('f-delapart').value,
    traiteurType:trType,
    traiteur:trType!=='aucun'?document.getElementById('f-traiteur').value:'',
    prixTable:trType==='interne'?(parseFloat(document.getElementById('f-prix-table')?.value)||0):0,
    neggafa:document.getElementById('f-neggafa').value,observation:document.getElementById('f-obs').value};
}
function updatePayDisplay(){
  const p=parseFloat(document.getElementById('f-prix').value)||0;
  const a=parseFloat(document.getElementById('f-avance').value)||0;
  // Calculer le total traiteur interne si applicable
  const trType=document.querySelector('input[name="traiteur-type"]:checked')?.value||'aucun';
  const prixTable=trType==='interne'?(parseFloat(document.getElementById('f-prix-table')?.value)||0):0;
  const nbTables=trType==='interne'?(parseFloat(document.getElementById('f-tables')?.value)||0):0;
  const traiteurTotal=prixTable*nbTables;
  const total=p+traiteurTotal; // total salle + traiteur interne
  const pd=document.getElementById('pay-display');
  if(!total){pd.style.display='none';return;}
  const v=pct(total,a),col=pcol(v),rest=Math.max(0,total-a);
  pd.style.display='flex';
  document.getElementById('pay-ring').innerHTML=ring(v,54,col)+`<span class="pring-pct" style="color:${col}">${v}%</span>`;
  const traiteurLine=traiteurTotal>0?`<div style="color:var(--text2);font-size:11px;margin-top:1px">Salle: ${fmtDH(p)} + Traiteur: ${fmtDH(traiteurTotal)}</div>`:'';
  document.getElementById('pay-text').innerHTML=`<div style="font-weight:700;font-size:15px;color:var(--text)">${plbl(v)}</div>
    ${traiteurLine}
    <div style="color:var(--text2);font-size:12px;margin-top:2px">Total: <b style="color:var(--text)">${fmtDH(total)}</b> · Reste: <b style="color:${col}">${fmtDH(rest)}</b></div>`;
}
function isFormDirty(){return JSON.stringify(getFormData())!==formSnap;}
function handleBack(){if(editingId!==null&&isFormDirty())openOverlay('ov-unsaved');else closeForm();}
function closeForm(){closeOverlay('ov-form');}

function saveForm(fromUnsaved){
  const d=getFormData();
  if(!d.nom.trim()){alert('Le nom du bénéficiaire est requis.');return;}
  if(!d.date){alert('La date est requise.');return;}
  if(!d.delapart.trim()){alert('Le champ "De la part de" est obligatoire.');document.getElementById('f-delapart').focus();return;}
  if(d.traiteurType==='interne'&&!d.traiteur.trim()){alert('Le nom du traiteur interne est obligatoire.');return;}
  if(d.traiteurType==='interne'&&(!d.prixTable||d.prixTable<=0)){alert('Le prix par table est obligatoire pour un traiteur interne.');return;}
  const isAdmin=currentUser.role==='admin';
  const existing=editingId?reservations.find(r=>r.id===editingId):null;
  let newStatus;
  if(!editingId)newStatus=isAdmin?'approved':'pending';
  else if(isAdmin)newStatus='approved'; // admin qui enregistre → toujours approuvé
  else newStatus='pending-edit'; // employee edits go to pending-edit

  // For pending-edit: compute diff to show admin what changed
  let changesSummary='';
  if(!isAdmin&&editingId&&existing){
    const labels={nom:'Nom',tel:'Téléphone',date:'Date',prix:'Montant',avance:'Avance',tables:'Tables',delapart:'De la part',traiteur:'Traiteur',neggafa:'Neggafa',observation:'Observation'};
    const changes=[];
    const compare={nom:d.nom,tel:d.tel,date:d.date,prix:String(parseFloat(d.prix)||0),avance:String(parseFloat(d.avance)||0),tables:String(parseInt(d.tables)||10),delapart:d.delapart,traiteur:d.traiteur||'',neggafa:d.neggafa||'',observation:d.observation||''};
    const orig={nom:existing.nom,tel:existing.tel,date:existing.date,prix:String(existing.prix),avance:String(existing.avance),tables:String(existing.tables),delapart:existing.delapart,traiteur:existing.traiteur||'',neggafa:existing.neggafa||'',observation:existing.observation||''};
    Object.keys(labels).forEach(k=>{if(compare[k]!==orig[k])changes.push(labels[k]+': '+orig[k]+' → '+compare[k]);});
    changesSummary=changes.join(' | ');
  }

  const r={
    id:editingId||uid(),hall:0,nom:d.nom,tel:d.tel,date:d.date,
    prix:parseFloat(d.prix)||0,avance:parseFloat(d.avance)||0,
        traiteurType:d.traiteurType||'',prixTable:d.prixTable||0,
        totalSalle:parseFloat(d.prix)||0,
        total:(parseFloat(d.prix)||0)+(d.traiteurType==='interne'?(d.prixTable||0)*(parseInt(d.tables)||0):0),
    tables:parseInt(d.tables)||10,delapart:d.delapart,
    traiteur:d.traiteur||'',neggafa:d.neggafa||'',observation:d.observation||'',
    createdBy:existing?.createdBy||currentUser.username,
    status:newStatus,
    changesSummary:changesSummary||existing?.changesSummary||'',
    // Store snapshot of original for pending-edit so admin can compare
    // Si déjà pending-edit, conserver le snapshot INITIAL (avant toute modification employé)
    originalSnapshot:(!isAdmin&&editingId&&existing&&newStatus==='pending-edit')
      ?(existing.originalSnapshot||{nom:existing.nom,tel:existing.tel,date:existing.date,prix:existing.prix,avance:existing.avance,tables:existing.tables,delapart:existing.delapart,traiteur:existing.traiteur||'',neggafa:existing.neggafa||'',observation:existing.observation||''})
      :(existing?.originalSnapshot||null)
  };
  // If admin approved pending-edit, clear snapshot
  if(isAdmin&&existing?.status==='pending-edit'){r.status='approved';r.originalSnapshot=null;r.changesSummary='';}

  if(!editingId)reservations.push(r);
  else reservations=reservations.map(x=>x.id===r.id?r:x);
  save();
  if(fromUnsaved)closeOverlay('ov-unsaved');
  closeForm();renderContent();updateBell();
  // Popup impression pour les nouvelles réservations (admin et employé)
  // Admin : immédiatement après création
  // Employé : après création (status pending, impression possible)
  if(!editingId){
    setTimeout(()=>showPrintPopup(r),300);
  }
}

async function approveRes(status){
  if(!editingId)return;
  if(status==='pending-delete'){
    // Admin approuve suppression → DELETE atomique sur Firebase
    const idToDel=editingId;
    reservations=reservations.filter(r=>r.id!==idToDel);
    saveLocal();closeForm();renderContent();updateBell();
    // NE PAS mettre isSaving=true ici : ce DELETE vient de l'admin
    // l'employé doit recevoir le SSE et mettre à jour son affichage
    try{
      await fbDelete('/reservations/'+idToDel);
      setSync('online','Temps réel ✓');isOnline=true;
    }catch(e){setSync('offline','Hors ligne');isOnline=false;}
    return;
  } else {
    // Admin approves new/edit → mark approved with current form data
    const d=getFormData();
    reservations=reservations.map(r=>{
      if(r.id!==editingId)return r;
      return{...r,nom:d.nom,tel:d.tel,date:d.date,prix:parseFloat(d.prix)||0,avance:parseFloat(d.avance)||0,
        tables:parseInt(d.tables)||10,delapart:d.delapart,traiteur:d.traiteur||'',neggafa:d.neggafa||'',
        observation:d.observation||'',status:'approved',originalSnapshot:null,changesSummary:''};
    });
  }
  save();closeForm();renderContent();updateBell();
}

function rejectRes(status){
  if(!editingId)return;
  if(status==='pending'){
    // Reject new reservation → delete it
    if(!confirm('Rejeter et supprimer cette demande de réservation ?'))return;
    reservations=reservations.filter(r=>r.id!==editingId);
  } else if(status==='pending-edit'){
    // Reject edit → restore originalSnapshot (the data BEFORE employee's modification)
    if(!confirm('Rejeter cette modification et restaurer les données originales ?'))return;
    reservations=reservations.map(r=>{
      if(r.id!==editingId) return r;
      const snap=r.originalSnapshot;
      if(!snap) return{...r,status:'approved'}; // fallback si pas de snapshot
      // Restaurer toutes les données originales
      return{
        ...r,
        nom:snap.nom, tel:snap.tel, date:snap.date,
        prix:snap.prix, avance:snap.avance, tables:snap.tables,
        delapart:snap.delapart, traiteur:snap.traiteur||'',
        neggafa:snap.neggafa||'', observation:snap.observation||'',
        status:'approved',
        originalSnapshot:null,
        changesSummary:''
      };
    });
  } else if(status==='pending-delete'){
    // Reject delete request → keep reservation as approved
    if(!confirm('Rejeter la demande de suppression ? La réservation sera conservée.'))return;
    reservations=reservations.map(r=>r.id===editingId?{...r,status:'approved',originalSnapshot:null,changesSummary:''}:r);
  }
  save();closeForm();renderContent();updateBell();
}

async function deleteResAdmin(){
  if(!confirm('Supprimer définitivement cette réservation ?'))return;
  const idToDel=editingId;
  // 1. Supprimer localement
  reservations=reservations.filter(x=>x.id!==idToDel);
  saveLocal();
  closeForm();renderContent();updateBell();
  // 2. Supprimer directement sur Firebase par chemin précis (DELETE atomique)
  try{
    await fbDelete('/reservations/'+idToDel);
    setSync('online','Temps réel ✓');isOnline=true;
  }catch(e){
    setSync('offline','Hors ligne');isOnline=false;
  }
}

function requestDelete(){
  if(!confirm('Demander la suppression de cette réservation ?\nL\'administrateur devra valider.'))return;
  reservations=reservations.map(r=>r.id===editingId?{...r,status:'pending-delete'}:r);
  save();closeForm();renderContent();updateBell();
}

  <h2>Détails de la réservation</h2>
  <table>
    <tr><td>Date</td><td><b>${r.date?new Date(r.date).toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'—'}</b></td></tr>
    <tr><td>Salle</td><td>Salle de Fêtes</td></tr>
    <tr><td>Nombre de tables</td><td>${r.tables||'—'}</td></tr>

    ${neggafaLine}
    ${r.observation?`<tr><td>Observation</td><td>${r.observation}</td></tr>`:''}
  </table>
  <h2>Détail financier</h2>
  <div class="total-box">
    <div class="total-row"><span>Montant total salle</span><span><b>${(r.prix||0).toLocaleString('fr-FR')} DH</b></span></div>
    ${traiteurTotal>0?`<div class="total-row"><span>Traiteur interne (${r.tables} tables × ${r.prixTable} DH)</span><span><b>${traiteurTotal.toLocaleString('fr-FR')} DH</b></span></div>`:''}
    <div class="total-row green"><span>Avance versée</span><span><b>- ${(r.avance||0).toLocaleString('fr-FR')} DH</b></span></div>
    ${totalPrix>(r.prix||0)?`<div class="total-row" style="font-weight:700"><span>Total général</span><span>${totalPrix.toLocaleString('fr-FR')} DH</span></div>`:''}
    <div class="total-row main red"><span>Reste à payer</span><span>${reste.toLocaleString('fr-FR')} DH</span></div>
  </div>
  <div class="footer">
    Document généré par Taj Lala Khadija • ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
    <br>Merci de votre confiance 🙏
  </div>
  <div class="no-print" style="text-align:center;margin-top:20px">
    <button onclick="window.print()" style="padding:12px 30px;background:#5c2a4e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-right:10px">🖨️ Imprimer</button>
    <button onclick="window.close()" style="padding:12px 30px;background:#eee;color:#333;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer">Fermer</button>
  </div>
  </body></html>`);
  win.document.close();
  setTimeout(()=>win.focus(),300);
}

function exportBackup(){
  const now=new Date();
  const ds=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const ts=`${String(now.getHours()).padStart(2,'0')}h${String(now.getMinutes()).padStart(2,'0')}`;
  const blob=new Blob([JSON.stringify({exportDate:now.toISOString(),totalReservations:reservations.length,reservations},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`salle-fetes-backup-${ds}-${ts}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  setSync('online',`✅ Sauvegarde exportée`);setTimeout(()=>setSync('online','Temps réel ✓'),3000);
}
function initImport(){
  document.getElementById('import-file').addEventListener('change',function(e){
    const file=e.target.files[0];if(!file)return;
    const status=document.getElementById('import-status');
    const reader=new FileReader();
    reader.onload=async function(ev){
      try{
        const parsed=JSON.parse(ev.target.result);
        const data=Array.isArray(parsed)?parsed:(parsed.reservations||null);
        if(!data||!data.every(r=>r.id&&r.date))throw new Error();
        if(!confirm(`Importer ${data.length} réservations ?\n\n⚠️ Cela remplacera toutes les données actuelles.`)){e.target.value='';return;}
        reservations=data;saveLocal();await fbWriteRes();renderContent();updateBell();
        if(status){status.style.display='block';status.style.color='#059669';status.textContent=`✅ ${data.length} réservations restaurées !`;setTimeout(()=>status.style.display='none',4000);}
      }catch(err){if(status){status.style.display='block';status.style.color='#dc2626';status.textContent='❌ Fichier invalide.';setTimeout(()=>status.style.display='none',5000);}}
      e.target.value='';
    };reader.readAsText(file);
  });
}
